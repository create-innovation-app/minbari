﻿<title>みんバリ</title>
<style>
  :root{
    --bg:#15100c;
    --panel:#1c150f;
    --panel-2:#241b12;
    --ink:#e9dcc8;
    --muted:#a6884f;
    --muted-dim:#7a6644;
    --line:#3a2c1c;
    --brass:#d8a253;
    --brass-hi:#f3cd8a;
    --brass-lo:#a6702c;
    --ice:#8fc4d6;
    --focus:#f3cd8a;
  }

  *{ box-sizing:border-box; }
  /* ダブルタップ拡大を無効化(連打しても拡大しない) */
  html, body, button, input, .stepper, .chips, .mode-toggle{ touch-action:manipulation; }
  button{ -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  /* 画面固定: 上下スクロール・引っぱり時のバウンドを無効化 */
  html{ height:100%; overflow:hidden; overscroll-behavior:none; }
  body{ position:fixed; inset:0; overflow:hidden; overscroll-behavior:none; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
    display:flex;
    justify-content:center;
    padding-top:max(16px, env(safe-area-inset-top));
    padding-bottom:max(24px, env(safe-area-inset-bottom));
    padding-left:max(14px, env(safe-area-inset-left));
    padding-right:max(14px, env(safe-area-inset-right));
    line-height:1.35;
  }
  .page{ width:100%; max-width:420px; }

  .panel{
    position:relative;
    background:linear-gradient(180deg, var(--panel), var(--bg));
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px 15px 14px;
    box-shadow:0 1px 2px rgba(0,0,0,0.4), 0 20px 44px -22px rgba(0,0,0,0.65);
    overflow:hidden;
  }
  .panel::before{
    content:"";
    position:absolute; inset:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse 340px 180px at 50% -12%, rgba(216,162,83,0.12), transparent 60%),
      radial-gradient(ellipse 220px 160px at 105% 105%, rgba(216,162,83,0.06), transparent 60%);
  }

  .eyebrow{
    position:relative;
    font-family:"IBM Plex Mono", monospace;
    font-weight:500;
    font-size:8.5px;
    letter-spacing:.26em;
    text-transform:uppercase;
    color:var(--muted-dim);
    text-align:center;
  }
  h1{
    position:relative;
    font-family:"Playfair Display", serif;
    font-weight:700;
    font-size:21px;
    text-align:center;
    margin:3px 0 12px;
    letter-spacing:.01em;
    background:linear-gradient(180deg, var(--brass-hi) 0%, var(--brass) 45%, var(--brass-lo) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:var(--brass);
  }

  .fields{ position:relative; display:flex; flex-direction:column; gap:12px; }

  .field-label{
    font-family:"IBM Plex Sans", sans-serif;
    font-weight:500;
    font-size:10.5px;
    letter-spacing:.04em;
    color:var(--muted);
  }
  .field-head{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:5px; }
  .field-value{
    font-family:"IBM Plex Mono", monospace;
    font-weight:600;
    font-size:14px;
    font-variant-numeric:tabular-nums;
    color:var(--ice);
  }

  /* volume stepper */
  .vol-block{ background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .vol-block .field-label{ margin-bottom:6px; display:block; }
  .stepper{ display:flex; align-items:center; gap:14px; }
  .step-btn{
    flex:none;
    width:34px; height:34px;
    border-radius:50%;
    border:1px solid var(--brass-lo);
    background:radial-gradient(circle at 35% 30%, var(--line), var(--bg));
    color:var(--brass);
    font-family:"IBM Plex Mono", monospace;
    font-size:16px;
    font-weight:600;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    line-height:1;
  }
  .step-btn:hover{ filter:brightness(1.1); }
  .step-btn:active{ transform:scale(0.96); }
  .step-btn:disabled{ opacity:.35; cursor:not-allowed; }

  .stepper-value{ flex:1; display:flex; align-items:baseline; justify-content:center; gap:5px; min-width:0; }
  .stepper-input{
    font-family:"IBM Plex Mono", monospace;
    font-weight:600;
    font-size:26px;
    font-variant-numeric:tabular-nums;
    color:var(--brass-hi);
    background:transparent;
    border:none;
    padding:0 2px;
    margin:0;
    width:5.2ch;
    text-align:right;
    -moz-appearance:textfield;
  }
  .stepper-input::-webkit-outer-spin-button,
  .stepper-input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .stepper-input:focus-visible{ outline:2px solid var(--focus); outline-offset:3px; border-radius:6px; }
  .stepper-unit{ font-family:"IBM Plex Sans", sans-serif; font-weight:500; font-size:12px; color:var(--muted); }

  input[type="number"]:focus-visible,
  input[type="range"]:focus-visible,
  button:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }

  .favorites{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:9px; }
  .fav-caption{
    font-family:"IBM Plex Mono", monospace;
    font-weight:500;
    font-size:8.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted-dim);
    margin-right:1px;
  }
  .fav-slots{ display:flex; gap:6px; }
  .fav-slot{
    font-family:"IBM Plex Mono", monospace;
    font-weight:600;
    font-size:11.5px;
    min-width:48px;
    height:26px;
    padding:0 9px;
    border-radius:999px;
    border:1px dashed var(--line);
    background:transparent;
    color:var(--muted-dim);
    display:flex; align-items:center; justify-content:center; gap:2px;
    cursor:pointer;
  }
  .fav-slot.filled{ border-style:solid; border-color:var(--brass-lo); color:var(--brass-hi); background:var(--panel); }
  .fav-index{ font-size:9px; opacity:.7; }
  .fav-slots.registering .fav-slot{ border-style:solid; border-color:var(--ice); color:var(--ice); }
  .fav-register{
    margin-left:auto;
    font-family:"IBM Plex Sans", sans-serif;
    font-weight:600;
    font-size:11px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--muted);
    border-radius:999px;
    padding:5px 10px;
    cursor:pointer;
  }
  .fav-register[aria-pressed="true"]{ background:var(--ice); border-color:var(--ice); color:#0e1a1d; }
  .fav-register:hover{ filter:brightness(1.1); }

  @media (prefers-reduced-motion:no-preference){
    .fav-slots.registering .fav-slot{ animation:favPulse 1.1s ease-in-out infinite; }
  }
  @keyframes favPulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(143,196,214,0); }
    50%{ box-shadow:0 0 0 3px rgba(143,196,214,0.22); }
  }

  /* ice ratio slider */
  input[type="range"]{
    -webkit-appearance:none;
    width:100%;
    height:5px;
    border-radius:999px;
    background:linear-gradient(to right, var(--brass) 0%, var(--brass) var(--pct,40%), var(--line) var(--pct,40%), var(--line) 100%);
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:18px; height:18px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--brass-hi), var(--brass-lo));
    border:1px solid var(--brass-lo);
    cursor:pointer;
    box-shadow:0 1px 4px rgba(0,0,0,0.5);
  }
  input[type="range"]::-moz-range-thumb{
    width:14px; height:14px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--brass-hi), var(--brass-lo));
    border:1px solid var(--brass-lo);
    cursor:pointer;
  }

  /* mode toggle */
  .mode-toggle{
    position:relative;
    display:flex;
    gap:4px;
    padding:3px;
    margin:0 auto 12px;
    max-width:220px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:999px;
  }
  .mode-btn{
    flex:1;
    font-family:"IBM Plex Mono", monospace;
    font-weight:600;
    font-size:12px;
    letter-spacing:.16em;
    padding:6px 0;
    border:none;
    border-radius:999px;
    background:transparent;
    color:var(--muted-dim);
    cursor:pointer;
  }
  .mode-btn[data-mode="ice"][aria-pressed="true"]{ background:var(--ice); color:#0e1a1d; }
  .mode-btn[data-mode="hot"][aria-pressed="true"]{ background:linear-gradient(180deg, #f0a77a, #c0613a); color:#2a0f05; }
  .stat-num.hot-num{ color:#f0a77a; }

  /* strength chips */
  .chips{ display:flex; gap:7px; flex-wrap:wrap; }
  .chip{
    font-family:"IBM Plex Sans", sans-serif;
    font-weight:600;
    font-size:11.5px;
    color:var(--muted);
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 13px;
    cursor:pointer;
  }
  .chip[aria-pressed="true"]{
    color:#241405;
    background:linear-gradient(180deg, var(--brass-hi), var(--brass-lo));
    border-color:var(--brass-lo);
    font-weight:700;
  }
  .chip:hover{ filter:brightness(1.08); }

  .divider{ height:1px; background:linear-gradient(90deg, transparent, var(--line) 15%, var(--line) 85%, transparent); margin:2px 0; }

  .result-title{
    font-family:"IBM Plex Sans", sans-serif;
    font-weight:600;
    font-size:11px;
    letter-spacing:.04em;
    color:var(--muted);
    margin-bottom:7px;
    display:block;
  }

  .stats{ display:flex; gap:7px; min-width:0; }
  .stat{
    flex:1;
    min-width:0;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 8px;
    text-align:center;
  }
  .stat-name{
    font-family:"IBM Plex Sans", sans-serif;
    font-weight:500;
    font-size:13px;
    color:var(--muted-dim);
  }
  .stat-num{
    font-family:"IBM Plex Mono", monospace;
    font-weight:600;
    font-size:27px;
    font-variant-numeric:tabular-nums;
    color:var(--brass-hi);
    white-space:nowrap;
  }
  .stat-num.ice-num{ color:var(--ice); }
  .stat-num small{ font-size:15px; font-weight:500; color:var(--muted); margin-left:2px; }

  @media (prefers-reduced-motion:no-preference){
    .stat-num{ transition:color .2s ease; }
  }

  /* timer */
  .timer-head{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .timer-clock{
    font-family:"IBM Plex Mono", monospace;
    font-weight:600;
    font-size:22px;
    font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg, var(--brass-hi), var(--brass-lo));
    -webkit-background-clip:text;
    background-clip:text;
    color:var(--brass);
  }
  .timer-body{ display:flex; gap:10px; align-items:flex-start; margin-top:10px; }

  .pour-glass-wrap{ flex:none; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:4px; width:108px; }
  .pour-glass{
    position:relative;
    width:100px;
    height:150px;
    clip-path:polygon(9% 0%, 91% 0%, 85% 100%, 15% 100%);
    border:1.5px solid var(--brass-lo);
    border-radius:6px;
    overflow:hidden;
    background:var(--panel-2);
    box-shadow:inset 0 2px 0 rgba(255,255,255,0.22), inset -6px 0 10px -6px rgba(0,0,0,0.5);
  }
  .pour-glass-fill{
    position:absolute;
    left:0; right:0; bottom:0;
    height:0%;
    background:linear-gradient(180deg, var(--brass-hi), var(--brass-lo));
    border-top:1px solid rgba(255,255,255,0.35);
  }
  .pour-glass-label{
    font-family:"IBM Plex Mono", monospace;
    font-size:9px;
    color:var(--muted-dim);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  @media (prefers-reduced-motion:no-preference){
    .pour-glass-fill{ transition:height .3s linear; }
  }

  .timer-controls{ display:flex; gap:8px; margin-top:9px; }
  .timer-btn{
    flex:1;
    font-family:"IBM Plex Sans", sans-serif;
    font-weight:700;
    font-size:13px;
    padding:11px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--muted);
    cursor:pointer;
  }
  .timer-btn.primary{
    flex:2;
    color:#241405;
    background:linear-gradient(180deg, var(--brass-hi), var(--brass-lo));
    border-color:var(--brass-lo);
    box-shadow:0 0 12px rgba(216,162,83,0.2);
  }
  .timer-btn.primary.running{ background:linear-gradient(180deg, #a9d8e4, var(--ice)); border-color:var(--ice); }
  .timer-btn:hover{ filter:brightness(1.08); }
  .timer-btn:active{ transform:scale(0.98); }

  .timer-steps{ flex:1; min-width:0; display:flex; flex-direction:column; gap:5px; }
  .timer-step{
    display:flex; align-items:center; gap:8px;
    padding:6px 9px;
    border-radius:7px;
    border-left:2px solid var(--line);
    background:var(--panel-2);
  }
  .timer-step-time{
    flex:none;
    font-family:"IBM Plex Mono", monospace;
    font-weight:600;
    font-size:10.5px;
    color:var(--muted-dim);
    min-width:30px;
    font-variant-numeric:tabular-nums;
  }
  .timer-step-label{
    font-family:"IBM Plex Sans", sans-serif;
    font-weight:500;
    font-size:12px;
    color:var(--ink);
    flex:1;
    min-width:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .timer-step-amount{
    flex:none;
    font-family:"IBM Plex Mono", monospace;
    font-weight:600;
    font-size:12.5px;
    font-variant-numeric:tabular-nums;
    color:var(--brass);
  }
  .timer-step.active{ border-left-color:var(--brass); background:rgba(216,162,83,0.08); }
  .timer-step.active .timer-step-label{ color:var(--brass-hi); }
  .timer-step.done{ opacity:.4; }

  @media (prefers-reduced-motion:no-preference){
    .timer-step{ transition:opacity .2s ease, background .2s ease; }
  }
</style>

<meta name="theme-color" content="#15100c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="みんバリ">
<meta name="mobile-web-app-capable" content="yes">

<div class="page">
  <div class="panel">
    <h1>みんバリ</h1>

    <div class="mode-toggle" id="modeToggle" role="group" aria-label="モード">
      <button type="button" class="mode-btn" data-mode="ice" aria-pressed="true">ICE</button>
      <button type="button" class="mode-btn" data-mode="hot" aria-pressed="false">HOT</button>
    </div>

    <div class="fields">
      <div class="vol-block">
        <span class="field-label">出来上がり容量</span>
        <div class="stepper">
          <button type="button" class="step-btn" id="volDown" aria-label="50ml減らす">−</button>
          <span class="stepper-value">
            <input type="number" class="stepper-input" id="volume" value="500" min="150" max="1000" step="50" inputmode="numeric">
            <span class="stepper-unit">ml</span>
          </span>
          <button type="button" class="step-btn" id="volUp" aria-label="50ml増やす">+</button>
        </div>
        <div class="favorites">
          <span class="fav-caption" id="favCaption">マイボトル</span>
          <div class="fav-slots" id="favSlots">
            <button type="button" class="fav-slot" data-slot="0">＋<span class="fav-index">1</span></button>
            <button type="button" class="fav-slot" data-slot="1">＋<span class="fav-index">2</span></button>
            <button type="button" class="fav-slot" data-slot="2">＋<span class="fav-index">3</span></button>
          </div>
          <button type="button" class="fav-register" id="favRegister" aria-pressed="false">登録</button>
        </div>
      </div>

      <div class="field" id="iceField">
        <div class="field-head">
          <label class="field-label" for="icePct">氷の比率</label>
          <span class="field-value"><span id="iceEcho">40</span>%</span>
        </div>
        <input type="range" id="icePct" min="0" max="100" step="10" value="40">
      </div>

      <div class="field">
        <span class="field-label" style="display:block; margin-bottom:6px;">濃さ</span>
        <div class="chips" id="ratioChips">
          <button type="button" class="chip" data-key="strong">濃いめ <span class="chip-ratio"></span></button>
          <button type="button" class="chip" data-key="normal" aria-pressed="true">標準 <span class="chip-ratio"></span></button>
          <button type="button" class="chip" data-key="light">軽め <span class="chip-ratio"></span></button>
        </div>
      </div>

      <div class="divider"></div>

      <div>
        <span class="result-title">必要な分量</span>
        <div class="stats">
          <div class="stat">
            <span class="stat-name">豆</span>
            <span class="stat-num" id="outBeans">33<small>g</small></span>
          </div>
          <div class="stat" id="iceStat">
            <span class="stat-name">氷</span>
            <span class="stat-num ice-num" id="outIce">367<small>g</small></span>
          </div>
          <div class="stat">
            <span class="stat-name">お湯</span>
            <span class="stat-num" id="outWater">133<small>g</small></span>
          </div>
          <div class="stat" id="tempStat" hidden>
            <span class="stat-name">湯温</span>
            <span class="stat-num hot-num">92<small>℃</small></span>
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <div>
        <div class="timer-head">
          <span class="result-title" style="margin-bottom:0;">抽出タイマー</span>
          <span class="timer-clock" id="timerClock">0:00</span>
        </div>
        <div class="timer-controls">
          <button type="button" class="timer-btn primary" id="timerStart">スタート</button>
          <button type="button" class="timer-btn" id="timerReset">リセット</button>
        </div>
        <div class="timer-body">
          <div class="timer-steps" id="timerSteps"></div>
          <div class="pour-glass-wrap">
            <div class="pour-glass" id="pourGlass"><div class="pour-glass-fill" id="pourFill"></div></div>
            <span class="pour-glass-label" id="pourLabel">0g</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

    var timerAccumulatedMs = 0;
    var timerSchedule = [];
    var timerTriggered = [];
    var lastBeansG = 0, lastWaterG = 0;
    var audioCtx = null;

    // ペーパードリップの注湯タイミング。James HoffmannのUltimate V60法(蒸らし=豆量の2倍→45秒待つ→
    // 1:15までに全体の60%→1:45までに全量)を基準に、豆量・湯量に応じて量だけスケールする。
    function computeSchedule(beansG, waterG){
      var bloom = Math.round(beansG * 2);
      bloom = Math.min(bloom, Math.round(waterG * 0.5));
      bloom = Math.max(bloom, 0);
      return [
        { t:0,   label:'蒸らし注湯', amount:bloom },
        { t:45,  label:'注ぎ再開', amount:null },
        { t:75,  label:'2投目 目安60%', amount:Math.round(waterG * 0.6) },
        { t:105, label:'最終投入 目安100%', amount:Math.round(waterG) },
        { t:210, label:'抽出完了の目安', amount:null }
      ];
    }

    function fmtClock(ms){
      var totalSec = Math.floor(ms / 1000);
      var m = Math.floor(totalSec / 60);
      var s = totalSec % 60;
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function ensureAudio(){
      try{
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if(audioCtx.state === 'suspended') audioCtx.resume();
      }catch(e){}
    }

    function beep(){
      try{
        if(!audioCtx) return;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.3, audioCtx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      }catch(e){}
    }

    function notifyStep(){
      beep();
      try{ if(navigator.vibrate) navigator.vibrate(200); }catch(e){}
    }

    // 注いだ量をタイマーのチェックポイント(蒸らし→2投目→最終投入)ごとの5段階で表す。
    // まだ量の指定がないチェックポイント(注ぎ再開・完了の目安)では直前の量をキープする。
    function stepPourAmount(currentIdx){
      var amt = 0;
      for(var i = 0; i <= currentIdx && i < timerSchedule.length; i++){
        if(timerSchedule[i].amount != null) amt = timerSchedule[i].amount;
      }
      return amt;
    }

    function updateTimerUI(elapsedMs){
      elapsedMs = elapsedMs || 0;
      timerClockEl.textContent = fmtClock(elapsedMs);
      var elapsedSec = elapsedMs / 1000;
      var currentIdx = -1;
      timerSchedule.forEach(function(step, i){ if(elapsedSec >= step.t) currentIdx = i; });

      var pourNow = stepPourAmount(currentIdx);
      var pourPct = lastWaterG > 0 ? clamp((pourNow / lastWaterG) * 100, 0, 100) : 0;
      pourFillEl.style.height = pourPct + '%';
      pourLabelEl.textContent = Math.round(pourNow) + 'g';

      timerStepsEl.innerHTML = '';
      timerSchedule.forEach(function(step, i){
        var row = document.createElement('div');
        row.className = 'timer-step' + (i < currentIdx ? ' done' : (i === currentIdx ? ' active' : ''));
        var timeSpan = document.createElement('span');
        timeSpan.className = 'timer-step-time';
        timeSpan.textContent = fmtClock(step.t * 1000);
        var labelSpan = document.createElement('span');
        labelSpan.className = 'timer-step-label';
        labelSpan.textContent = step.label;
        var amountSpan = document.createElement('span');
        amountSpan.className = 'timer-step-amount';
        amountSpan.textContent = step.amount != null ? step.amount + 'g' : '';
        row.appendChild(timeSpan);
        row.appendChild(labelSpan);
        row.appendChild(amountSpan);
        timerStepsEl.appendChild(row);
      });

      // コップの高さをステップ一覧の実際の高さにJSで合わせる(flexの伸縮だけに頼ると
      // 一部ブラウザで高さがおかしくなるため、確実に一致させる)。
      var stepsH = timerStepsEl.offsetHeight;
      if(stepsH > 0) pourGlassEl.style.height = stepsH + 'px';
    }

    function timerTick(){
      var elapsedMs = timerAccumulatedMs + (Date.now() - timerStartTimestamp);
      timerSchedule.forEach(function(step, i){
        if(!timerTriggered[i] && elapsedMs / 1000 >= step.t){
          timerTriggered[i] = true;
          notifyStep();
        }
      });
      updateTimerUI(elapsedMs);
    }

    function resetTimer(){
      clearInterval(timerIntervalId);
      timerState = 'idle';
      timerAccumulatedMs = 0;
      timerStartTimestamp = null;
      timerStartBtn.textContent = 'スタート';
      timerStartBtn.classList.remove('running');
      timerSchedule = computeSchedule(lastBeansG, lastWaterG);
      timerTriggered = timerSchedule.map(function(){ return false; });
      updateTimerUI(0);
    }

    // 湯1gが溶かす氷の量(g)。旧版は「100℃の湯 × 0℃の氷」で計算していたが、実際は
    //  ・ドリッパーを通って氷に届く抽出液は約85℃まで下がっている
    //  ・冷凍庫の氷は約-15℃で、0℃まで温める分の熱も必要(氷の比熱2.09J/g℃)
    // ため溶ける量は理論値より少なく、氷が指示より多く残っていた。実測に近づくよう補正する。
    var C_WATER = 4.186, C_ICE = 2.09, L_FUSION = 334, T_BREW_AT_ICE = 85, T_FREEZER = -15;
    var MELT_K = (C_WATER * T_BREW_AT_ICE) / (L_FUSION + C_ICE * (0 - T_FREEZER)); // ≈0.97(旧1.25)

    // HOTモードの比率(豆1:注ぐ湯)。SCAゴールデンカップ基準は55g/L(約1:18)、
    // ハンドドリップの一般的な目安は1:15〜1:16(例: 10g:150ml)。推奨湯温は93℃±3℃。
    var HOT_RATIOS = { strong:14, normal:16, light:18 };
    var ICE_RATIOS = { strong:12, normal:15, light:17 };
    var mode = 'ice';
    var strengthKey = 'normal';
    var modeBtns = document.querySelectorAll('.mode-btn');
    var iceField = document.getElementById('iceField');
    var iceStat = document.getElementById('iceStat');
    var tempStat = document.getElementById('tempStat');

    // ペーパードリップの粉が保持して出てこない湯の量。豆の自重の約2.2倍(参考: Blackout Coffee Co. / Coffee Chronicler)
    var ABSORB_K = 2.2;

    function clamp(v, lo, hi){ return Math.min(hi, Math.max(lo, v)); }

    function snapVolume(v){
      v = Math.round(v / VOL_STEP) * VOL_STEP;
      return clamp(v, VOL_MIN, VOL_MAX);
    }

    function loadState(){
      try{
        var raw = localStorage.getItem('iceRatioCalc');
        if(!raw) return;
        var s = JSON.parse(raw);
        if(s.volume) volumeInput.value = snapVolume(parseFloat(s.volume));
        if(s.ice) iceInput.value = s.ice;
        if(s.strength && ICE_RATIOS[s.strength]) strengthKey = s.strength;
        else if(s.ratio){ var r = parseFloat(s.ratio); strengthKey = r <= 12 ? 'strong' : (r >= 17 ? 'light' : 'normal'); }
        if(s.mode === 'hot' || s.mode === 'ice') mode = s.mode;
        if(Array.isArray(s.favorites) && s.favorites.length === 3) favorites = s.favorites;
      }catch(e){}
    }

    function saveState(){
      try{
        localStorage.setItem('iceRatioCalc', JSON.stringify({
          volume: volumeInput.value,
          ice: iceInput.value,
          strength: strengthKey,
          mode: mode,
          favorites: favorites
        }));
      }catch(e){}
    }

    function exitRegistering(){
      registering = false;
      favRegisterBtn.setAttribute('aria-pressed', 'false');
      favSlotsWrap.classList.remove('registering');
      favCaption.textContent = 'マイボトル';
    }

    function renderFavorites(){
      favSlotEls.forEach(function(slot){
        var idx = +slot.dataset.slot;
        var val = favorites[idx];
        if(val == null){
          slot.classList.remove('filled');
          slot.innerHTML = '＋<span class="fav-index">' + (idx + 1) + '</span>';
        }else{
          slot.classList.add('filled');
          slot.innerHTML = val + '<span class="fav-index">ml</span>';
        }
      });
    }

    function fmt(n, digits){
      return n.toLocaleString('ja-JP', { minimumFractionDigits: digits, maximumFractionDigits: digits });
    }

    function render(){
      var volume = clamp(parseFloat(volumeInput.value) || 0, 0, 5000);
      var icePct = clamp(parseFloat(iceInput.value) || 0, 0, 100);
      var ratios = mode === 'hot' ? HOT_RATIOS : ICE_RATIOS;
      var ratio = ratios[strengthKey];

      modeBtns.forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.mode === mode)); });
      iceField.hidden = mode === 'hot';
      iceStat.hidden = mode === 'hot';
      tempStat.hidden = mode !== 'hot';
      ratioChips.forEach(function(c){
        c.setAttribute('aria-pressed', String(c.dataset.key === strengthKey));
        c.querySelector('.chip-ratio').textContent = '1:' + ratios[c.dataset.key];
      });

      if(mode === 'hot'){
        // HOT: 豆:注ぐ湯 = 1:ratio。粉が豆の約2.2倍の湯を保持するため、
        // カップに落ちる量(=出来上がり容量)から逆算して注ぐ湯を求める。
        var hotWaterG = volume * ratio / (ratio - ABSORB_K);
        var hotBeansG = hotWaterG / ratio;
        outBeans.innerHTML = fmt(Math.round(hotBeansG), 0) + '<small>g</small>';
        outWater.innerHTML = fmt(Math.round(hotWaterG), 0) + '<small>g</small>';
        volDownBtn.disabled = volume <= VOL_MIN;
        volUpBtn.disabled = volume >= VOL_MAX;
        lastBeansG = hotBeansG;
        lastWaterG = hotWaterG;
        if(timerState === 'idle'){
          timerSchedule = computeSchedule(lastBeansG, lastWaterG);
          updateTimerUI(0);
        }
        saveState();
        return;
      }

      // 目標: 湯を注いで溶けきった後の「最終的な氷:液体」比率が icePct になるように、
      // 事前に用意する氷の量と、注ぐ湯の量を逆算する。
      // 挽いた豆は自重の約2.2倍の湯を保持して外に出てこない(ペーパードリップの保水率)ため、
      // その分を上乗せして注がないと、仕上がりが指定容量より少なく・濃くなってしまう。
      var beansG = volume / ratio;
      var absorbedG = beansG * ABSORB_K;                // 粉に保持されてカップに出てこない湯の量
      var finalIceG = volume * icePct / 100;            // 溶け残る氷(仕上がり時)
      var finalLiquidG = volume - finalIceG;            // 湯+溶けた氷(仕上がり時の液体)
      var effectiveWaterG = finalLiquidG / (1 + MELT_K); // ドリッパーから実際に落ちてくる湯の量
      var waterG = effectiveWaterG + absorbedG;          // 実際にドリッパーへ注ぐ湯の量(保水分を含む)
      var iceG = volume - effectiveWaterG;               // 事前にグラスへ用意する氷の量(溶ける分を含む)

      iceEcho.textContent = Math.round(icePct);

      outBeans.innerHTML = fmt(Math.round(beansG), 0) + '<small>g</small>';
      outIce.innerHTML = fmt(Math.round(iceG), 0) + '<small>g</small>';
      outWater.innerHTML = fmt(Math.round(waterG), 0) + '<small>g</small>';

      iceInput.style.setProperty('--pct', ((icePct - iceInput.min) / (iceInput.max - iceInput.min) * 100) + '%');

      volDownBtn.disabled = volume <= VOL_MIN;
      volUpBtn.disabled = volume >= VOL_MAX;

      lastBeansG = beansG;
      lastWaterG = waterG;
      if(timerState === 'idle'){
        timerSchedule = computeSchedule(lastBeansG, lastWaterG);
        updateTimerUI(0);
      }

      saveState();
    }

    iceInput.addEventListener('input', render);

    volumeInput.addEventListener('input', function(){
      if(volumeInput.value !== '') render();
    });
    volumeInput.addEventListener('change', function(){
      volumeInput.value = snapVolume(parseFloat(volumeInput.value) || VOL_MIN);
      render();
    });

    function stepVolume(dir){
      volumeInput.value = snapVolume((parseFloat(volumeInput.value) || VOL_MIN) + dir * VOL_STEP);
      render();
    }

    // タップで1段階、長押しで連続増減。pointerイベントで処理し、ダブルタップ拡大も抑止する。
    function bindRepeat(btn, dir){
      var holdTimer = null, repeatTimer = null;
      function stop(){
        clearTimeout(holdTimer); clearInterval(repeatTimer);
        holdTimer = repeatTimer = null;
      }
      btn.addEventListener('pointerdown', function(e){
        e.preventDefault();
        if(btn.disabled) return;
        stop();
        stepVolume(dir);
        holdTimer = setTimeout(function(){
          repeatTimer = setInterval(function(){
            if(btn.disabled){ stop(); return; }
            stepVolume(dir);
          }, 110);
        }, 400);
      });
      ['pointerup','pointerleave','pointercancel'].forEach(function(ev){ btn.addEventListener(ev, stop); });
      btn.addEventListener('dblclick', function(e){ e.preventDefault(); });
      btn.addEventListener('contextmenu', function(e){ e.preventDefault(); });
      // キーボード操作(Enter/Space)用
      btn.addEventListener('click', function(e){ if(e.detail === 0) stepVolume(dir); });
    }
    bindRepeat(volDownBtn, -1);
    bindRepeat(volUpBtn, 1);

    ratioChips.forEach(function(c){
      c.addEventListener('click', function(){ strengthKey = c.dataset.key; render(); });
    });

    modeBtns.forEach(function(b){
      b.addEventListener('click', function(){
        if(mode === b.dataset.mode) return;
        mode = b.dataset.mode;
        if(timerState !== 'idle') resetTimer();
        render();
      });
    });

    timerStartBtn.addEventListener('click', function(){
      ensureAudio();
      if(timerState === 'idle'){
        timerSchedule = computeSchedule(lastBeansG, lastWaterG);
        timerTriggered = timerSchedule.map(function(){ return false; });
        timerAccumulatedMs = 0;
        timerStartTimestamp = Date.now();
        timerState = 'running';
        timerStartBtn.textContent = '一時停止';
        timerStartBtn.classList.add('running');
        timerIntervalId = setInterval(timerTick, 200);
        timerTick();
      }else if(timerState === 'running'){
        timerAccumulatedMs += Date.now() - timerStartTimestamp;
        clearInterval(timerIntervalId);
        timerState = 'paused';
        timerStartBtn.textContent = '再開';
        timerStartBtn.classList.remove('running');
      }else if(timerState === 'paused'){
        timerStartTimestamp = Date.now();
        timerState = 'running';
        timerStartBtn.textContent = '一時停止';
        timerStartBtn.classList.add('running');
        timerIntervalId = setInterval(timerTick, 200);
        timerTick();
      }
    });

    timerResetBtn.addEventListener('click', resetTimer);

    favRegisterBtn.addEventListener('click', function(){
      if(registering){ exitRegistering(); return; }
      registering = true;
      favRegisterBtn.setAttribute('aria-pressed', 'true');
      favSlotsWrap.classList.add('registering');
      favCaption.textContent = '登録先をタップ';
    });

    favSlotEls.forEach(function(slot){
      slot.addEventListener('click', function(){
        var idx = +slot.dataset.slot;
        if(registering){
          favorites[idx] = snapVolume(parseFloat(volumeInput.value) || VOL_MIN);
          exitRegistering();
          renderFavorites();
          saveState();
        }else if(favorites[idx] != null){
          volumeInput.value = favorites[idx];
          render();
        }else{
          favorites[idx] = snapVolume(parseFloat(volumeInput.value) || VOL_MIN);
          renderFavorites();
          saveState();
        }
      });
    });

    loadState();
    renderFavorites();
    render();
  })();
</script>
</body></html>
